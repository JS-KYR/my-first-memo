<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나만의 메모장</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #fdf6f0 0%, #f3e8ff 50%, #e8f0ff 100%);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  .container {
    width: 100%;
    max-width: 560px;
  }

  h1 {
    text-align: center;
    color: #4a3b6b;
    font-size: 28px;
    margin-bottom: 6px;
  }

  .subtitle {
    text-align: center;
    color: #8b7fa8;
    font-size: 14px;
    margin-bottom: 28px;
  }

  .input-card {
    background: #ffffff;
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(120, 90, 160, 0.12);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  textarea {
    resize: none;
    border: 1px solid #eae1f5;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-family: inherit;
    min-height: 90px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    background: #fbf9ff;
  }

  textarea:focus {
    border-color: #b79ce8;
    box-shadow: 0 0 0 3px rgba(183, 156, 232, 0.2);
  }

  button.add-btn {
    align-self: flex-end;
    border: none;
    background: linear-gradient(135deg, #a78bfa, #8b5cf6);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 6px 16px rgba(139, 92, 246, 0.35);
  }

  button.add-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(139, 92, 246, 0.45);
  }

  button.add-btn:active {
    transform: translateY(0);
  }

  .memo-list {
    margin-top: 28px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .memo-card {
    background: #ffffff;
    border-radius: 14px;
    padding: 16px 18px;
    box-shadow: 0 6px 18px rgba(120, 90, 160, 0.08);
    position: relative;
    animation: fadeIn 0.25s ease;
    border-left: 4px solid #c4b5fd;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .memo-text {
    font-size: 15px;
    color: #3f3350;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
    margin-bottom: 10px;
  }

  .memo-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .memo-date {
    font-size: 12px;
    color: #a89bc2;
  }

  .delete-btn {
    border: none;
    background: transparent;
    color: #c9a4a4;
    font-size: 13px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    transition: background 0.15s, color 0.15s;
  }

  .delete-btn:hover {
    background: #fdeeee;
    color: #d9534f;
  }

  .empty-state {
    text-align: center;
    color: #b7abcf;
    font-size: 14px;
    margin-top: 40px;
  }
</style>
</head>
<body>

  <div class="container">
    <h1>📝 나만의 메모장</h1>
    <p class="subtitle">생각날 때 바로 적어두는 나만의 공간</p>

    <div class="input-card">
      <textarea id="memoInput" placeholder="메모를 입력하세요..."></textarea>
      <button class="add-btn" id="addBtn">추가하기</button>
    </div>

    <div class="memo-list" id="memoList"></div>
    <p class="empty-state" id="emptyState" style="display:none;">아직 작성된 메모가 없어요.</p>
  </div>

<script>
  const memoInput = document.getElementById('memoInput');
  const addBtn = document.getElementById('addBtn');
  const memoList = document.getElementById('memoList');
  const emptyState = document.getElementById('emptyState');

  const STORAGE_KEY = 'my-memo-app-notes';

  function loadMemos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveMemos(memos) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(memos));
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function renderMemos() {
    const memos = loadMemos();
    memoList.innerHTML = '';

    if (memos.length === 0) {
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    // 최신 메모가 위로 오도록 정렬
    memos
      .slice()
      .sort((a, b) => b.id - a.id)
      .forEach((memo) => {
        const card = document.createElement('div');
        card.className = 'memo-card';

        const text = document.createElement('div');
        text.className = 'memo-text';
        text.textContent = memo.text;

        const footer = document.createElement('div');
        footer.className = 'memo-footer';

        const date = document.createElement('span');
        date.className = 'memo-date';
        date.textContent = formatDate(memo.id);

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '삭제';
        delBtn.addEventListener('click', () => deleteMemo(memo.id));

        footer.appendChild(date);
        footer.appendChild(delBtn);
        card.appendChild(text);
        card.appendChild(footer);
        memoList.appendChild(card);
      });
  }

  function addMemo() {
    const value = memoInput.value.trim();
    if (!value) {
      memoInput.focus();
      return;
    }
    const memos = loadMemos();
    memos.push({ id: Date.now(), text: value });
    saveMemos(memos);
    memoInput.value = '';
    memoInput.focus();
    renderMemos();
  }

  function deleteMemo(id) {
    const memos = loadMemos().filter((m) => m.id !== id);
    saveMemos(memos);
    renderMemos();
  }

  addBtn.addEventListener('click', addMemo);

  memoInput.addEventListener('keydown', (e) => {
    // Ctrl/Cmd + Enter 로 빠르게 추가
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      addMemo();
    }
  });

  renderMemos();
</script>

</body>
</html>
